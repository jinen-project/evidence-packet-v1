<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Packet</title><link rel="stylesheet" href="/app.css"></head><body><main><header><h1>Evidence Packet</h1><p>Turn an answer and its provided sources into an inspectable evidence map.</p><p class="boundary">It does not decide truth. It shows the current relationship between each claim and the sources you provided.</p></header><section class="input"><label>Answer<textarea id="answer" placeholder="Paste an AI or human-generated answer. Sentences become reviewable claims."></textarea></label><label>Source documents <input id="files" type="file" multiple accept=".txt,.md,.html,.htm,text/plain,text/markdown,text/html"></label><div id="source-list" class="source-list">No sources selected.</div><button id="generate">Generate evidence packet</button><p id="error" role="alert"></p></section><section id="packet" hidden><div class="actions"><h2 id="packet-title">Evidence Packet</h2><button id="download-json">Download JSON</button><button id="download-md">Download Markdown</button></div><p id="meta"></p><div id="unresolved"></div><div id="claims"></div></section></main><script src="/app.js"></script></body></html>
